<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free browser-based tools for text, calculations, developers, images and productivity."><title>All Free Tools | PriyoTools</title><style>
:root{--bg:#f5f6fb;--ink:#172033;--muted:#69758a;--line:#e4e8f0;--brand:#5b5ce2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,Arial}.nav{padding:17px max(20px,calc((100% - 1100px)/2));background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0}.nav b{font-size:21px}.nav a{color:var(--brand);text-decoration:none;font-weight:700}.hero{padding:65px 20px;text-align:center;color:white;background:linear-gradient(125deg,#111827,#353879)}h1{font-size:clamp(34px,6vw,60px);line-height:1.1;margin:10px}.hero p{color:#d4d8f5}.search{display:flex;max-width:600px;margin:25px auto 0;background:white;padding:6px;border-radius:12px}.search input{flex:1;border:0;padding:12px;min-width:0;outline:0}.search button,button.primary{background:var(--brand);color:white;border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:25px 20px}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.cats button,.copy{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 13px;cursor:pointer}.cats button.active{background:#e9eaff;border-color:#aeb0f6;color:#393ac0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:19px}.card small{color:#07815e;font-weight:800}.card p{color:var(--muted);min-height:45px}.card button{color:var(--brand);border:0;background:none;font-weight:800;cursor:pointer;padding:0}.modal{display:none;position:fixed;inset:0;background:#111827aa;place-items:center;padding:15px}.modal.open{display:grid}.dialog{background:white;border-radius:16px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px}.field textarea{min-height:120px}.out{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f8;padding:12px;border-radius:9px;min-height:42px}.muted{color:var(--muted)}footer{text-align:center;padding:30px;background:#111827;color:#d4d8e5;margin-top:45px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{padding:50px 15px}}
</style></head><body><nav class="nav"><b>✦ PriyoTools</b><a href="index.html">Home</a></nav><header class="hero"><div>FREE ONLINE UTILITIES</div><h1>Tools that make life easier.</h1><p>Fast, simple and free tools for everyday tasks. No account required.</p><div class="search"><input id="q" placeholder="Search tools..."><button id="search">Search</button></div></header><main class="wrap"><h2>Explore tools</h2><div class="cats" id="cats"><button class="active" data-cat="All">All</button><button data-cat="Text">Text</button><button data-cat="Calculators">Calculators</button><button data-cat="Developer">Developer</button><button data-cat="Image">Image</button><button data-cat="Productivity">Productivity</button><button data-cat="Education">Education</button><button data-cat="Security">Security</button></div><div class="grid" id="grid"></div><p class="muted">More tools and categories will be added over time. Most tools run locally in your browser.</p></main><footer>© <span id="year"></span> PriyoTools · Free online tools for everyone</footer><div class="modal" id="modal"><div class="dialog"><div class="head"><h2 id="title"></h2><button class="copy" id="close">Close ✕</button></div><div id="body"></div></div></div>
<script>
const data=[['Word Counter','Text','Count words, characters and sentences.'],['Case Converter','Text','Convert uppercase, lowercase and title case.'],['Remove Extra Spaces','Text','Clean repeated spaces and blank lines.'],['Basic Calculator','Calculators','Add, subtract, multiply and divide.'],['Percentage Calculator','Calculators','Calculate a percentage of any value.'],['Age & Date Difference','Calculators','Calculate the days between two dates.'],['JSON Formatter','Developer','Format, validate and minify JSON.'],['Base64 Encoder / Decoder','Developer','Encode or decode Base64 text.'],['URL Encoder / Decoder','Developer','Encode or decode URL components.'],['UUID Generator','Developer','Generate a random UUID.'],['Password Generator','Security','Generate a random password locally.'],['Image Resizer','Image','Resize an image in your browser.'],['Focus Timer','Productivity','Run a simple focus countdown.'],['GPA Average Calculator','Education','Calculate an average from grade values.']];
let cat='All',q='';const grid=document.getElementById('grid');function draw(){let a=data.filter(x=>(cat==='All'||x[1]===cat)&&x.join(' ').toLowerCase().includes(q));grid.innerHTML=a.map(x=>'<article class="card"><small>'+x[1].toUpperCase()+' · FREE</small><h3>'+x[0]+'</h3><p>'+x[2]+'</p><button data-tool="'+x[0]+'">Open tool →</button></article>').join('')||'<p>No matching tools found.</p>'}draw();document.getElementById('cats').onclick=e=>{let b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));draw()};function search(){q=document.getElementById('q').value.toLowerCase();draw()}document.getElementById('search').onclick=search;document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')search()};document.getElementById('year').textContent=new Date().getFullYear();
const modal=document.getElementById('modal'),body=document.getElementById('body');document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
function open(name){document.getElementById('title').textContent=name;let f='',fn=()=>{};const area='<div class="field"><label>Text</label><textarea id="a"></textarea></div>',field=(l,id,type='number')=>'<div class="field"><label>'+l+'</label><input id="'+id+'" type="'+type+'"></div>',out='<div class="field"><label>Result</label><div class="out" id="result"></div></div><button class="copy" id="copy">Copy result</button>',run='<button class="primary" id="run">Run tool</button>';
if(name==='Word Counter'){f=area+'<div class="out" id="result">Words: 0 · Characters: 0</div>';fn=()=>{let s=a.value;result.textContent='Words: '+(s.trim()?s.trim().split(/\s+/).length:0)+' · Characters: '+s.length+' · Sentences: '+(s.match(/[.!?]+/g)||[]).length}}
else if(name==='Case Converter'){f=area+'<div class="cats"><button data-case="upper">UPPERCASE</button><button data-case="lower">lowercase</button><button data-case="title">Title Case</button></div>'+out}
else if(name==='Remove Extra Spaces'){f=area+run+out;fn=()=>result.textContent=a.value.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim()}
else if(name==='Basic Calculator'){f=field('First number','a')+field('Second number','b')+'<div class="field"><label>Operation</label><select id="op"><option>+</option><option>-</option><option>*</option><option>/</option></select></div>'+run+out;fn=()=>{let x=+a.value,y=+b.value,o=op.value;result.textContent=o==='/'&&y===0?'Cannot divide by zero':String(o==='+'?x+y:o==='-'?x-y:o==='*'?x*y:x/y)}}
else if(name==='Percentage Calculator'){f=field('Value','a')+field('Percentage','b')+run+out;fn=()=>result.textContent=String(+a.value*+b.value/100)}
else if(name==='Age & Date Difference'){f=field('Start date','a','date')+field('End date','b','date')+run+out;fn=()=>{let x=new Date(a.value),y=new Date(b.value);result.textContent=isNaN(x)||isNaN(y)||y<x?'Enter valid dates in order':Math.floor((y-x)/86400000)+' days'}}
else if(name==='JSON Formatter'){f=area+run+out;fn=()=>{try{result.textContent=JSON.stringify(JSON.parse(a.value),null,2)}catch(e){result.textContent='Invalid JSON: '+e.message}}}
else if(name==='Base64 Encoder / Decoder'||name==='URL Encoder / Decoder'){f=area+'<div class="cats"><button id="enc">Encode</button><button id="dec">Decode</button></div>'+out}
else if(name==='UUID Generator'){f=run+out;fn=()=>result.textContent=crypto.randomUUID()}
else if(name==='Password Generator'){f=field('Length (8–64)','a')+run+out;fn=()=>{let n=Math.max(8,Math.min(64,+a.value||16)),c='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%';let r=new Uint32Array(n);crypto.getRandomValues(r);result.textContent=Array.from(r,x=>c[x%c.length]).join('')}}
else if(name==='Image Resizer'){f='<div class="field"><label>Choose image</label><input id="file" type="file" accept="image/*"></div>'+field('Target width (px)','a')+run+'<p id="status" class="muted">Image stays in your browser.</p>';fn=()=>{let file=document.getElementById('file').files[0],w=+a.value;if(!file||!w){status.textContent='Choose an image and width.';return}let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{let l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='resized.png';l.click();URL.revokeObjectURL(u);status.textContent='Image downloaded.'})};im.src=u}}
else if(name==='Focus Timer'){f=field('Minutes','a')+'<div class="out" id="result">Ready</div><button class="primary" id="start">Start</button><button class="copy" id="reset">Reset</button>'}
else if(name==='GPA Average Calculator'){f=area.replace('Text','Grades (comma separated)')+run+out;fn=()=>{let n=a.value.split(',').map(Number);result.textContent=n.some(x=>!Number.isFinite(x))?'Enter valid numbers':(n.reduce((x,y)=>x+y,0)/n.length).toFixed(2)}}
body.innerHTML=f;modal.classList.add('open');if(document.getElementById('run'))document.getElementById('run').onclick=fn;let cp=document.getElementById('copy');if(cp)cp.onclick=()=>navigator.clipboard?.writeText(document.getElementById('result').textContent);body.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{let s=a.value,c=b.dataset.case;result.textContent=c==='upper'?s.toUpperCase():c==='lower'?s.toLowerCase():s.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase())});let enc=document.getElementById('enc'),dec=document.getElementById('dec');if(enc)enc.onclick=()=>{try{result.textContent=name.startsWith('Base64')?btoa(unescape(encodeURIComponent(a.value))):encodeURIComponent(a.value)}catch(e){result.textContent=e.message}};if(dec)dec.onclick=()=>{try{result.textContent=name.startsWith('Base64')?decodeURIComponent(escape(atob(a.value))):decodeURIComponent(a.value)}catch(e){result.textContent='Invalid encoded input'}};if(name==='Focus Timer'){let timer;start.onclick=()=>{clearInterval(timer);let n=Math.max(1,Math.min(180,+a.value||25))*60;timer=setInterval(()=>{n--;result.textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');if(n<=0){clearInterval(timer);result.textContent='Session complete!'}},1000)};reset.onclick=()=>{clearInterval(timer);result.textContent='Ready'}}}
grid.onclick=e=>{let b=e.target.closest('[data-tool]');if(b)open(b.dataset.tool)};
</script></body></html>
