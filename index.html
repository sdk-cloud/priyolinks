<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হট গ্যালারি সাইট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            line-height: 1.6;
        }

        header {
            background-color: #000;
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid #ff4500;
        }

        header h1 {
            font-size: 2.5rem;
            color: #ff4500;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            color: #ccc;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.03);
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .gallery-item .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            text-align: center;
            font-size: 1rem;
        }

        footer {
            background-color: #000;
            padding: 20px 0;
            text-align: center;
            margin-top: 30px;
            border-top: 2px solid #ff4500;
        }

        footer p {
            color: #ccc;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>হট গ্যালারি</h1>
        <p>আপনার প্রিয় মুহূর্তগুলি শেয়ার করুন</p>
    </header>

    <div class="container">
        <div class="gallery">
            <!-- গ্যালারি আইটেমগুলি এখানে যোগ করুন -->
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,model" alt="হট মডেল">
                <div class="caption">হট মডেল</div>
            </div>
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,car" alt="হট কার">
                <div class="caption">হট কার</div>
            </div>
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,food" alt="হট ফুড">
                <div class="caption">হট ফুড</div>
            </div>
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,beach" alt="হট বিচ">
                <div class="caption">হট বিচ</div>
            </div>
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,fashion" alt="হট ফ্যাশন">
                <div class="caption">হট ফ্যাশন</div>
            </div>
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,city" alt="হট সিটি">
                <div class="caption">হট সিটি</div>
            </div>
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,technology" alt="হট টেকনোলজি">
                <div class="caption">হট টেকনোলজি</div>
            </div>
            <div class="gallery-item">
                <img src="https://source.unsplash.com/random/300x200/?hot,sports" alt="হট স্পোর্টস">
                <div class="caption">হট স্পোর্টস</div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; ২০২৩ হট গ্যালারি সাইট | সব অধিকার সংরক্ষিত</p>
    </footer>
</body>
</html>
